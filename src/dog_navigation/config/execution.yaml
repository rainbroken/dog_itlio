# Software limits are provisional. Confirm dimensions, ground offset and measured
# braking on the robot before allowing hardware autonomous output.
navigation_executor:
  ros__parameters:
    enabled: false
    base_ground_offset: 0.65
    walk_speed: 0.20
    stair_speed: 0.08
    acceleration: 0.15
    yaw_rate: 0.30
    yaw_acceleration: 0.50
    stair_yaw_rate: 0.15
    goal_xy_tolerance: 0.15
    goal_z_tolerance: 0.12
    max_tracking_error: 0.12
velocity_guard:
  ros__parameters:
    allow_autonomous: false
    calibration_confirmed: false
    base_ground_offset: 0.65
