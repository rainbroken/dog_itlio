# 系统侧输出策略。传感器算法默认值仍来自 IteraLIO，安装外参统一来自 URDF。
# 网页启动建图时自动加载；修改后重新启动建图会话生效。
itera_lio_node:
  ros__parameters:
    # —— 工作模式与轨迹缓存 ——
    mode:
      type: lio
    path:
      max_poses: 10000
    backend:
      enabled: true             # 启用后端处理；回环开关由 launch 单独控制

    # —— 网页与下游模块的几何输出 ——
    debug:
      launch_rviz: false
      publish_deskewed: false
      # 几何扫描输出给后续实时地形/障碍模块；坐标系是 odom。
      publish_registered: true
      publish_effective: false
      publish_local_map: false
      publish_global_map: true
      publish_map_updates: false
      publish_optimized_map: true
    preview:
      # 累计预览保留 20 万点；Web 按空间块增量传输，浏览器逐步补齐。
      # 完整扫描与位姿索引顺序写盘，保存 PCD 的密度由 save_pcd.voxel_size 控制。
      global_map_voxel_size: 0.10
      global_map_max_points: 200000
      global_map_snapshot_frequency_hz: 1.0
    image_record:
      enabled: false            # 当前纯 LiDAR–IMU 链路不依赖相机

    # —— PCD 保存策略 ——
    save_pcd:
      source: full_deskewed      # 保存累计的去畸变扫描
      save_pcd_on_shutdown: true # 正常退出时保存；需等待保存完成再关闭终端
      refinement_archive: false
      refine_after_save: false
      voxel_size: 0.05           # 保存相关体素参数，m
      # 证据网格只用于动静判断；输出仍按上面的 0.05m 保存。
      # true 保留对照 PCD、逐帧扫描归档及后端调试输出；默认仅保留两份地图。
      keep_debug_artifacts: false
      dynamic_filter:
        enabled: true
        evidence_voxel_size: 0.20
        max_range: 25.0
        min_free_observations: 3
